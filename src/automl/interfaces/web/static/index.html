<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATML — Visual ML Lab & AutoML Workbench</title>
  <!-- Google Fonts: Space Grotesk & IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'Menlo', 'monospace'],
          },
          colors: {
            carbon: {
              base: '#111111',
              panel: '#16171c',
              card: '#1c1d24',
              border: '#27272e',
            },
            cement: {
              DEFAULT: '#D8D6CF',
              light: '#F1EFE9',
              dark: '#8E8C85',
            },
            signal: {
              orange: '#E5512D',
              green: '#63D49A',
              yellow: '#E7C84B',
              red: '#D85454',
              blue: '#5C78FF',
              violet: '#9C7CFF',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/workbench.css">
</head>
<body class="bg-[#111111] text-[#F1EFE9] min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Top Industrial Mission Control Bar -->
  <header class="bg-[#16171c] border-b border-[#27272e] px-6 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center space-x-6">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="location.reload()">
        <span class="bg-[#111111] text-[#E5512D] border border-[#E5512D]/40 font-bold text-xs px-2.5 py-1 rounded-sm tracking-wider font-mono">⚡ AUTO/ML LAB</span>
        <span class="font-bold text-xs text-[#D8D6CF] tracking-widest uppercase font-mono hidden sm:inline">WORKBENCH</span>
      </div>

      <div class="hidden md:flex items-center space-x-2 text-xs border-l border-[#27272e] pl-6 font-mono">
        <span class="text-[#D8D6CF]/60 text-[11px] uppercase tracking-wider">PROJECT:</span>
        <span id="projectNameLabel" class="font-bold text-[#F1EFE9]">ACTIVE WORKSPACE</span>
      </div>

      <div class="hidden lg:flex items-center space-x-3 text-xs border-l border-[#27272e] pl-6 font-mono">
        <span id="globalStatusBadge" class="badge-gain px-2.5 py-0.5 rounded-sm font-mono text-[11px] font-semibold flex items-center space-x-1.5">
          <span>● READY</span>
        </span>
        <span id="sysHardwareHeader" class="text-[11px] text-[#D8D6CF]/70">SYS / ONLINE</span>
      </div>
    </div>

    <!-- Actions & Agent Button -->
    <div class="flex items-center space-x-3 text-xs">
      <div class="hidden sm:flex items-center space-x-1.5 bg-[#111111] px-3 py-1 rounded-sm border border-[#27272e] text-[#D8D6CF] font-mono text-[11px]">
        <span class="text-[#D8D6CF]/60">WORKSPACE:</span>
        <span id="workspaceLabel" class="text-[#5C78FF] font-bold truncate max-w-xs">CONNECTING...</span>
      </div>

      <button id="btnRefresh" class="bg-[#1c1d24] hover:bg-[#27272e] text-[#F1EFE9] px-3 py-1.5 rounded-sm border border-[#27272e] font-mono font-medium transition-colors text-[11px] flex items-center space-x-1.5">
        <span>↻</span>
        <span>SYNC</span>
      </button>

      <button id="btnToggleAgent" class="bg-[#9C7CFF]/10 hover:bg-[#9C7CFF]/20 text-[#9C7CFF] border border-[#9C7CFF]/30 px-3 py-1.5 rounded-sm font-mono font-semibold flex items-center space-x-1.5 transition-colors text-[11px]">
        <span>✦</span>
        <span>AGENT</span>
      </button>
    </div>
  </header>

  <!-- App Body: Sidebar + Main Canvas -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Definitive Navigation Sidebar -->
    <aside class="w-64 bg-[#16171c] border-r border-[#27272e] p-3 flex flex-col justify-between hidden md:flex">
      <div class="space-y-1">
        <div class="text-[10px] font-mono font-bold uppercase tracking-wider text-[#D8D6CF]/60 px-3 py-2 border-b border-[#27272e] mb-2 flex justify-between items-center">
          <span>NAVIGATION</span>
          <span class="text-[#63D49A]">SYS / ON</span>
        </div>

        <a href="#" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-sm text-xs font-mono border-l-2 border-transparent transition-all" data-nav="overview">
          <span class="text-[#E5512D] font-bold">01</span>
          <span class="font-sans font-medium text-sm">Dashboard</span>
        </a>

        <a href="#" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-sm text-xs font-mono border-l-2 border-transparent transition-all" data-nav="datasets">
          <span class="text-[#5C78FF] font-bold">02</span>
          <span class="font-sans font-medium text-sm">Datasets</span>
        </a>

        <a href="#" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-sm text-xs font-mono border-l-2 border-transparent transition-all" data-nav="studio">
          <span class="text-[#E7C84B] font-bold">03</span>
          <span class="font-sans font-medium text-sm">Experiments</span>
        </a>

        <a href="#" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-sm text-xs font-mono border-l-2 border-transparent transition-all" data-nav="compare">
          <span class="text-[#9C7CFF] font-bold">04</span>
          <span class="font-sans font-medium text-sm">Models</span>
        </a>

        <a href="#" class="nav-item flex items-center space-x-3 px-3 py-2 rounded-sm text-xs font-mono border-l-2 border-transparent transition-all" data-nav="pipelines">
          <span class="text-[#D8D6CF] font-bold">05</span>
          <span class="font-sans font-medium text-sm">Pipelines</span>
        </a>

        <a href="#" class="nav-item flex items-center justify-between px-3 py-2 rounded-sm text-xs font-mono border-l-2 border-transparent transition-all" data-nav="kaggle">
          <div class="flex items-center space-x-3">
            <span class="text-[#63D49A] font-bold">06</span>
            <span class="font-sans font-medium text-sm" id="kaggleNavLabel">Deployments</span>
          </div>
          <span id="kaggleNavBadge" class="badge-gain text-[9px] px-1.5 py-0.2 rounded-sm font-mono font-bold">—</span>
        </a>

        <div class="pt-4 pb-1 text-[10px] font-mono font-bold uppercase tracking-wider text-[#D8D6CF]/60 px-3 border-t border-[#27272e] mt-4">
          INTELLIGENCE
        </div>

        <a href="#" class="nav-item flex items-center justify-between px-3 py-2 rounded-sm text-xs font-medium border-l-2 border-transparent transition-all text-[#9C7CFF] hover:text-[#9C7CFF]/80" data-nav="knowledge">
          <div class="flex items-center space-x-3 font-mono">
            <span class="text-xs">🧠</span>
            <span class="font-sans">Knowledge</span>
          </div>
          <span class="badge-intel text-[9px] px-1.5 py-0.2 rounded-sm font-mono font-bold">V0.8</span>
        </a>

        <a href="#" class="nav-item flex items-center justify-between px-3 py-2 rounded-sm text-xs font-medium border-l-2 border-transparent transition-all text-[#9C7CFF] hover:text-[#9C7CFF]/80" data-nav="agent">
          <div class="flex items-center space-x-3 font-mono">
            <span class="text-xs">✦</span>
            <span class="font-sans">Agent Drawer</span>
          </div>
          <span class="badge-intel text-[9px] px-1.5 py-0.2 rounded-sm font-mono font-bold">V1.0</span>
        </a>
      </div>

      <!-- Version footer -->
      <div class="pt-3 border-t border-[#27272e] text-[11px] text-[#D8D6CF]/60 space-y-1 font-mono">
        <div class="flex justify-between">
          <span>CATML LAB</span>
          <span class="text-[#D8D6CF] font-semibold">V0.7.0</span>
        </div>
        <div class="text-[10px] text-[#D8D6CF]/40">HEXAGONAL • CQRS ENGINE</div>
      </div>
    </aside>

    <!-- Main Content Canvas -->
    <main class="flex-1 overflow-y-auto p-6 relative bg-[#111111]" id="mainContent">
      <!-- Injected dynamically by App Router -->
    </main>

    <!-- Lateral Agent Drawer (Slide-in) -->
    <div id="agentDrawer" class="fixed top-0 right-0 w-96 h-screen z-50 transform translate-x-full transition-transform duration-300">
      <!-- Injected by AgentDrawer component -->
    </div>
  </div>


  <!-- Global Modal Container -->
  <div id="modalContainer"></div>

  <!-- Modular JavaScript Entrypoint -->
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
