[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catml"
dynamic = ["version"]
description = "The Agent-Native AutoML Engine for Humans and AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CATML" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "optuna>=3.0",
    "scipy>=1.10",
    "joblib>=1.3",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
mcp = [
    "mcp>=1.2.0",
]
agents = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
models = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
vision = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "pillow>=9.0",
]
nlp = [
    "scikit-learn>=1.3",
]
all = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "mcp>=1.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "pillow>=9.0",
]

[project.scripts]
catml = "automl.interfaces.cli.main:main"
automl = "automl.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "automl.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
