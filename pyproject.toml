[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-platform"
dynamic = ["version"]
description = "Modular AutoML platform with experiment-first architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CATML" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "optuna>=3.0",
    "scipy>=1.10",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
mcp = [
    "mcp>=1.2.0",
]
agents = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
]

[project.scripts]
automl = "automl.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "automl.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
