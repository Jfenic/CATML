name: Release

# Trusted Publishing to PyPI / TestPyPI.
# Configure pending publishers on PyPI for repository Jfenic/catml, workflow
# release.yml, and protected GitHub Environments "pypi" / "testpypi"
# (required reviewers recommended before enabling production publish).
#
# Does NOT run on every push — only version tags (v*) or manual dispatch.
# Publish jobs download the verified build artifact only (no rebuild with secrets).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
          - none

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Assert Workbench static assets in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          required = [
              "automl/interfaces/web/static/index.html",
              "automl/interfaces/web/static/css/workbench.css",
              "automl/interfaces/web/static/js/app.js",
              "automl/interfaces/web/static/js/views/home.js",
          ]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as z:
              files = set(z.namelist())
          missing = [r for r in required if r not in files]
          assert not missing, missing
          print("OK: wheel includes Workbench static assets")
          PY
      - name: Assert tag matches package version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          init = Path("src/automl/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M)
          assert match, "Could not parse __version__"
          version = match.group(1)
          print(f"package_version={version}")

          def normalize(v: str) -> str:
              return re.sub(r"[^0-9a-z]", "", v.lower())

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              tag_body = tag[1:] if tag.startswith("v") else tag
              assert normalize(tag_body) == normalize(version), (
                  f"Tag '{tag}' does not match package version '{version}'"
              )
              print(f"OK: tag {tag} matches version {version}")
          else:
              print("OK: non-tag dispatch; skipped tag↔version assert")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"package_version={version}\n")
          PY
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Install wheel in clean venv and smoke
        run: |
          python -m pip install --upgrade pip
          python -m venv test_env
          ./test_env/bin/pip install dist/*.whl
          ./test_env/bin/pip install pytest pytest-cov
          ./test_env/bin/catml --help
          ./test_env/bin/python tests/smoke_test.py
      - name: Run unit/integration suite (release gate)
        run: |
          python -m pip install -e ".[dev,mcp,agents,parquet]"
          pytest --cov=automl --cov-fail-under=85 -q
      - name: Dependency audit (blocking on release)
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Workbench JS unit tests
        run: node --test tests/js/*.test.mjs

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build, verify]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
