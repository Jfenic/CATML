name: Release

# Trusted Publishing to PyPI. Configure a pending publisher on PyPI for
# repository Jfenic/CATML, workflow release.yml, environment "pypi".
# This workflow does NOT run on every push — only on version tags or manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Assert Workbench static assets in wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          required = [
              "automl/interfaces/web/static/index.html",
              "automl/interfaces/web/static/css/workbench.css",
              "automl/interfaces/web/static/js/app.js",
              "automl/interfaces/web/static/js/views/home.js",
          ]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as z:
              files = set(z.namelist())
          missing = [r for r in required if r not in files]
          assert not missing, missing
          print("OK: wheel includes Workbench static assets")
          PY
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
