# CATML Benchmark Protocol v1 — FROZEN.
# Do not change metrics, split policy, or seeds mid-campaign.
# Material changes require protocol version 1.1+ and a new results namespace.
name: catml-benchmark-v1
version: "1.0.0"
status: frozen

evaluation: shared_external_holdout
# One holdout per (dataset, seed) fixed before any framework runs.
# All frameworks fit train only; primary_score from shared sklearn evaluator.

hardware_policy:
  identical_limits: true
  note: "Same CPU/RAM caps for every framework in a campaign."

budgets:
  pilot_minutes: [5]
  campaign_minutes: [5, 20]
  note: "5 = smoke/validation; 20 = formal Study A campaign."

seeds: [42, 43, 44]

metrics:
  binary_classification:
    primary: roc_auc
    secondary: [average_precision, log_loss, balanced_accuracy, accuracy, f1_macro]
  multiclass:
    primary: f1_macro
    secondary: [accuracy, log_loss, balanced_accuracy]
  regression:
    primary: rmse
    secondary: [mae, r2]

studies:
  C:
    name: robustness_and_trust
    description: Adversarial fixtures with predetermined success criteria.
    entrypoint: tests/test_benchmark_study_c.py
    gate_before_campaign: true
  A:
    name: predictive_performance
    description: External comparison via OpenML/sklearn curated suite (AMLB-style rules).
    frameworks: [sklearn_baseline, catml, flaml, autogluon]
    seeds: [42, 43, 44]
    datasets_from: datasets-manifest.csv
    status_filter: active
    require_all_frameworks_ok: true
  B:
    name: explore_and_agents
    description: Incremental value of Explore/recipes/agents under hidden holdout.
    configurations: [sklearn_baseline, catml_base, catml_explore, catml_agent]
    holdout_policy: never_seen_during_search
    after: study_A_report

failure_reporting:
  score_when_all_failed: null
  track_failure_rate: true
  never_treat_zero_as_success: true
  skipped_does_not_count_as_comparison: true

reproducibility:
  record:
    - catml_git_commit
    - python_version
    - dependency_versions
    - os
    - cpu_model
    - ram_gb
    - seed
    - wall_time_s
    - peak_rss_mb
    - cpu_user_s
  outputs:
    - results/v1/raw-results.json
    - results/v1/summary.csv
    - results/v1/aggregate.csv
    - results/v1/failures.csv
    - results/v1/environment.json
    - results/v1/checksums.sha256
    - results/v1/report.md
